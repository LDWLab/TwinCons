name: tests

on:
  push:
  pull_request:

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - {os: ubuntu-22.04, python-version: "3.8"}
          - {os: ubuntu-latest, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.12"}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mafft
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mafft
      - name: Install mafft
        if: runner.os == 'macOS'
        run: brew install mafft
      - name: Install TwinCons
        run: python -m pip install .
      - name: Test the installed package
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s tests -t . -v

  oldest-dependencies:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - name: Install mafft
        run: sudo apt-get update && sudo apt-get install -y mafft
      - name: Install TwinCons with its oldest supported dependencies
        run: python -m pip install . "numpy==1.21.6" "matplotlib==3.5.3" "biopython==1.79"
      - name: Test the installed package
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s tests -t . -v

  tools:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install TwinCons and tool dependencies
        run: python -m pip install . -r tools/requirements.txt
      - name: Check every tool script starts
        run: |
          for script in tools/*.py; do
            python "$script" -h > /dev/null || { echo "::error::$script failed"; exit 1; }
          done
      - name: Test the tools
        run: python -m unittest discover -s tools/tests -t tools -v
