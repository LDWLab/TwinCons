name: tests

on:
  push:
  pull_request:

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mafft
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mafft
      - name: Install mafft
        if: runner.os == 'macOS'
        run: brew install mafft
      - name: Install TwinCons
        run: python -m pip install .
      - name: Test the installed package
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s tests -t . -v

  tools:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install TwinCons and tool dependencies
        run: python -m pip install -r requirements_complete.txt .
      - name: Check every tool script starts
        run: |
          for script in tools/*.py; do
            python "$script" -h > /dev/null || { echo "::error::$script failed"; exit 1; }
          done
