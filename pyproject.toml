[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "TwinCons"
version = "0.7.0"
description = "Conservation score for two sequence groups within one multiple sequence alignment."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Petar Penev", email = "peteripenev@gmail.com" },
]
keywords = ["multiple sequence alignment", "conservation", "substitution matrix", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "biopython>=1.79",
]

[project.urls]
Homepage = "https://github.com/LDWLab/TwinCons"
Issues = "https://github.com/LDWLab/TwinCons/issues"
Paper = "https://doi.org/10.1371/journal.pcbi.1009541"

[project.scripts]
twcons = "twincons.entry:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["twincons", "twincons.*"]

[tool.setuptools.package-data]
"twincons" = [
    "matrices/*.dat",
    "matrices/BLOSUM/*.out",
    "matrices/structureDerived/*.dat",
    "matrices/jp/*.dat",
]
